# Include this file inside the TLS server block for the public hostname.
# The trailing slash in proxy_pass strips the /voting/ prefix before the
# request reaches the Flask application, which serves the app at its root.
location = /voting {
    return 301 /voting/;
}

location /voting/ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
}
